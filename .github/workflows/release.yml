name: Build macOS app

# Every push to main publishes a ready-to-download build as the "latest" pre-release.
# Tags like v1.2.3 publish a versioned release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the Electron binary
        run: node apps/desktop/node_modules/electron/install.js

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cd apps/desktop && npm pkg set version="$V"

      - name: Build app
        working-directory: apps/desktop
        env:
          # Optional: real code signing + notarization when these secrets exist.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -n "$CSC_LINK" ]; then EXTRA="-c.mac.identity=null -c.mac.hardenedRuntime=true"; fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ]; then EXTRA="$EXTRA -c.mac.notarize=true"; fi
          pnpm --filter @leocad/web build
          pnpm --filter @leocad/mcp build
          node build.mjs
          npx electron-builder --mac --publish never $EXTRA

      - name: Release notes
        run: |
          cat > notes.md <<NOTES
          **leocad ${{ steps.version.outputs.version }}** for macOS — built from ${GITHUB_SHA::7}.

          ### Install
          1. Download the \`.dmg\` for your Mac: **arm64** = Apple Silicon (M1–M4), **x64** = Intel.
          2. Open it and drag **leocad** into Applications.
          3. First start: if macOS says the app can't be verified, open **System Settings → Privacy & Security** and click **Open Anyway** — or run once in Terminal:
             \`xattr -dr com.apple.quarantine /Applications/leocad.app\`

          Projects are saved as \`.leocad\` files in \`~/Documents/leocad\`.
          NOTES

      - name: Publish rolling "latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest --prerelease --target "$GITHUB_SHA" --title "Latest build (main)" --notes-file notes.md \
            apps/desktop/release/*.dmg apps/desktop/release/*.zip

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "leocad $GITHUB_REF_NAME" --notes-file notes.md \
            apps/desktop/release/*.dmg apps/desktop/release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: leocad-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
