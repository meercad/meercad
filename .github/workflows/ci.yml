name: CI
on:
  pull_request:
  push:
    branches: [main]

# Test levels: docs/TESTING.md. A pull request gets the quick level first and all tests in parallel;
# main gets all tests. Performance and E2E run before a release (release.yml).
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/third-party-licenses.mjs --check
      - run: pnpm typecheck
      - run: pnpm test:quick
      - run: pnpm build

  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project integration-slow
